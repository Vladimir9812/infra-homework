apiVersion: v1
kind: Service
metadata:
  name: server-service
spec:
  type: NodePort
  selector:
    app: server
  ports:
    - name: http
      port: 3000 # Pod и другие объекты внутри кластера
      targetPort: 3000 # Само приложение, например Node.js/Express
      nodePort: 30080 # Ваш браузер, curl с хоста, внешний клиент
